openapi: 3.1.0
info:
  title: WISLA FM — fm-module BFF API
  version: 1.0.0
  description: |
    REST API for WISLA Fault Management module (BFF on port 8080).
    Serves Angular SPA and adapter ingestion. JSON bodies use **camelCase**.
    PostgreSQL database: `wisla_fm`.

servers:
  - url: http://localhost:8080
    description: fm-module (BFF + static Angular)

tags:
  - name: system
    description: Health and probes
  - name: auth
    description: Authentication and session
  - name: ingest
    description: Adapter → fm-module event intake
  - name: events
    description: Processed FM events (console)
  - name: raw-events
    description: Primary / pre-dedup events
  - name: sources
    description: Event sources (adapters)
  - name: adapters
    description: Adapter service runtime
  - name: rules
    description: Processing rules and canvas
  - name: notifications
    description: In-app push notifications from rule canvas
  - name: health
    description: Product and CI health read-models
  - name: console
    description: Event maps (saved filters)
  - name: admin
    description: Users, roles, configuration items, products
  - name: settings
    description: Module and user preferences
  - name: dashboard
    description: Dashboard aggregates
  - name: internal
    description: Service-to-service (adapter cache)

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness / readiness probe
      operationId: getHealth
      security: []
      x-mvp: true
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Authenticate user and issue JWT
      operationId: login
      security: []
      x-mvp: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Current authenticated user profile
      operationId: getCurrentUser
      x-mvp: true
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/ingest:
    post:
      tags: [ingest]
      summary: Ingest raw event batch from adapter
      description: |
        Synchronous HTTPS intake from adapter service.
        Authenticated via source API key (`X-Api-Key` header or `Authorization: Bearer {apiKey}`).
        Query parameter `sourceKey` must match the configured key for the source.
      operationId: ingestEvents
      security:
        - sourceApiKey: []
      x-mvp: true
      parameters:
        - $ref: '#/components/parameters/sourceKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '202':
          description: Batch accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Source blocked or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events:
    get:
      tags: [events]
      summary: List processed events for console
      operationId: listEvents
      x-mvp: true
      parameters:
        - name: status
          in: query
          description: Filter by event status (repeatable)
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EventStatus'
          style: form
          explode: true
        - name: severity
          in: query
          description: Filter by severity (repeatable)
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Severity'
          style: form
          explode: true
        - name: query
          in: query
          description: No-code query string (map query DSL)
          schema:
            type: string
        - name: mapId
          in: query
          description: Apply saved event map filter by ID
          schema:
            type: string
            format: uuid
        - name: ciId
          in: query
          schema:
            type: string
            format: uuid
        - name: productId
          in: query
          schema:
            type: string
            format: uuid
        - name: sourceId
          in: query
          schema:
            type: string
            format: uuid
        - name: assignedUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - name: sort
          in: query
          description: |
            Sort field and direction (`field,direction`). Default: `createdAt,desc`.
            Allowed fields: `createdAt`, `lastRepeatAt`, `repeatCount`, `severity`, `status`, `title`, `nodeFqdn`, `systemName`.
            `severity` uses custom order fatal → normal; `lastRepeatAt` nulls last on desc, nulls first on asc.
          schema:
            type: string
            default: createdAt,desc
      responses:
        '200':
          description: Paged event list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          description: Invalid sort field or direction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/events/batch:
    post:
      tags: [events]
      summary: Bulk create or update events (service integration)
      operationId: createEventsBatch
      x-mvp: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/EventCreate'
      responses:
        '200':
          description: Batch processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: integer
                  updated:
                    type: integer
                  ids:
                    type: array
                    items:
                      type: string
                      format: uuid

  /api/v1/events/{id}:
    get:
      tags: [events]
      summary: Get event by ID (card view)
      operationId: getEvent
      x-mvp: true
      parameters:
        - $ref: '#/components/parameters/eventId'
      responses:
        '200':
          description: Event with action log and relations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [events]
      summary: Partial update (status, severity, assignment, tags)
      operationId: patchEvent
      x-mvp: true
      parameters:
        - $ref: '#/components/parameters/eventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPatch'
      responses:
        '200':
          description: Updated event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{id}/actions:
    post:
      tags: [events]
      summary: Operator action on event
      description: Actions — `take`, `close`, `comment`, `defer`, `maintenance`
      operationId: postEventAction
      x-mvp: true
      parameters:
        - $ref: '#/components/parameters/eventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventActionRequest'
      responses:
        '200':
          description: Action recorded; updated event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventActionResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Action not allowed in current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{id}/history:
    get:
      tags: [events]
      summary: Attribute change history (ClickHouse in prod)
      operationId: getEventHistory
      x-mvp: false
      parameters:
        - $ref: '#/components/parameters/eventId'
      responses:
        '200':
          description: History entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventHistoryEntry'

  /api/v1/raw-events:
    get:
      tags: [raw-events]
      summary: List primary / pre-processing events
      operationId: listRawEvents
      x-mvp: true
      parameters:
        - name: sourceId
          in: query
          schema:
            type: string
            format: uuid
        - name: severity
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Severity'
          style: form
          explode: true
        - name: query
          in: query
          schema:
            type: string
        - name: processed
          in: query
          description: Filter by processing status
          schema:
            type: boolean
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Paged raw events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawEventPage'

  /api/v1/adapters/runtime:
    get:
      tags: [adapters]
      summary: Adapter service runtime and per-source status
      operationId: getAdapterRuntime
      x-mvp: true
      responses:
        '200':
          description: Aggregated adapter health and source runtime bindings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterRuntimeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/sources:
    get:
      tags: [sources]
      summary: List event sources
      operationId: listSources
      x-mvp: true
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SourceStatus'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/SourceType'
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Source list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventSource'
    post:
      tags: [sources]
      summary: Create event source
      operationId: createSource
      x-mvp: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSourceCreate'
      responses:
        '201':
          description: Source created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSource'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/sources/{id}:
    get:
      tags: [sources]
      summary: Get source by ID
      operationId: getSource
      x-mvp: true
      parameters:
        - $ref: '#/components/parameters/sourceId'
      responses:
        '200':
          description: Source details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSourceDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [sources]
      summary: Update source configuration
      operationId: patchSource
      x-mvp: true
      parameters:
        - $ref: '#/components/parameters/sourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSourcePatch'
      responses:
        '200':
          description: Updated source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSource'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [sources]
      summary: Delete source
      operationId: deleteSource
      x-mvp: true
      parameters:
        - $ref: '#/components/parameters/sourceId'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Source has dependent events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sources/{id}/test:
    post:
      tags: [sources]
      summary: Test source connectivity via adapter probe
      description: |
        Orchestrates adapter `POST /internal/probe` for the source. When the plain-text API key
        is not stored server-side, the UI passes `ingestApiKey` from sessionStorage (after create
        or regenerate). fm-module syncs source config to adapter before probing.
      operationId: testSource
      x-mvp: true
      parameters:
        - $ref: '#/components/parameters/sourceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceTestRequest'
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceTestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: Adapter probe unreachable or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sources/{id}/bind-simulator:
    post:
      tags: [sources]
      summary: Bind zabbix-simulator to this source (demo)
      description: |
        Configures dev/demo zabbix-simulator via `POST /config` with this source's webhook key
        and the provided `ingestApiKey`. Demo/admin feature — not for production Zabbix integration.
      operationId: bindSimulator
      x-mvp: true
      parameters:
        - $ref: '#/components/parameters/sourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindSimulatorRequest'
      responses:
        '200':
          description: Simulator configured for this source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindSimulatorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: zabbix-simulator unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sources/{id}/send-test-event:
    post:
      tags: [sources]
      summary: Send one test event via bound zabbix-simulator
      description: |
        Proxies `POST /tick` on zabbix-simulator. Requires prior `bind-simulator`.
        Delivers a problem or recovery webhook through adapter → fm-module ingest.
      operationId: sendTestEvent
      x-mvp: true
      parameters:
        - $ref: '#/components/parameters/sourceId'
      responses:
        '200':
          description: Tick result from simulator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceSimulatorTickResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Simulator not bound to this source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: zabbix-simulator unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sources/{id}/simulator-control:
    post:
      tags: [sources]
      summary: Enable or disable zabbix-simulator auto-tick
      description: |
        Proxies `POST /control` on zabbix-simulator. Toggles periodic webhook delivery
        for the bound demo source. Used by the source card «Автотик» switch.
      operationId: setSimulatorControl
      x-mvp: true
      parameters:
        - $ref: '#/components/parameters/sourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceSimulatorControlRequest'
      responses:
        '200':
          description: Auto-tick state after control
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceSimulatorControlResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: zabbix-simulator unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sources/{id}/simulator-status:
    get:
      tags: [sources]
      summary: zabbix-simulator health and binding for this source
      description: |
        Aggregates simulator `GET /health` with whether runtime config matches this source's
        webhook key. Used by the source card demo block (bind status, auto-tick, webhook URL).
      operationId: getSimulatorStatus
      x-mvp: true
      parameters:
        - $ref: '#/components/parameters/sourceId'
      responses:
        '200':
          description: Simulator status for this source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceSimulatorStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: zabbix-simulator unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sources/{id}/runs:
    get:
      tags: [sources]
      summary: Pull source execution log
      operationId: listSourceRuns
      x-mvp: false
      parameters:
        - $ref: '#/components/parameters/sourceId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Execution log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SourceRunLog'
                  page:
                    $ref: '#/components/schemas/PageMeta'

  /api/v1/rules:
    get:
      tags: [rules]
      summary: List processing rules
      operationId: listRules
      x-mvp: true
      parameters:
        - name: ruleType
          in: query
          schema:
            $ref: '#/components/schemas/RuleType'
        - name: enabled
          in: query
          schema:
            type: boolean
        - name: approvalStatus
          in: query
          schema:
            $ref: '#/components/schemas/ApprovalStatus'
      responses:
        '200':
          description: Rule list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessingRule'
    post:
      tags: [rules]
      summary: Create processing rule
      description: |
        When `canvas` is present, the server validates graph structure before persist:
        at least one **stream trigger** (`type=trigger`, `data.triggerType=stream`) reachable
        from the graph entry, and at least one **action block** (`dedup`, `threshold`,
        `correlation`, `notify`, or `push`) on a path from that trigger. Orphan nodes (not connected to the
        trigger subgraph) are rejected. **notify** blocks require `data.channel` (`telegram` or `email`);
        when `channel=email`, `data.emailAddress` must be a valid email. `status` blocks are accepted but not executed at
        runtime (post-MVP). **notify** is a stub at runtime (no real SMTP/Telegram); **push** persists in-app notifications for UI polling.
      operationId: createRule
      x-mvp: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessingRuleCreate'
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingRuleDetail'
        '400':
          description: Invalid canvas structure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingStreamTrigger:
                  summary: No stream trigger
                  value:
                    error: canvas_validation
                    message: Rule canvas must include at least one trigger with triggerType=stream
                    details:
                      - field: canvas.nodes
                        message: missing_stream_trigger
                missingActionBlock:
                  summary: No action block on trigger path
                  value:
                    error: canvas_validation
                    message: Rule canvas must include at least one action block (dedup, threshold, correlation, notify, or push) reachable from the stream trigger
                    details:
                      - field: canvas.nodes
                        message: missing_action_block
                notifyMissingChannel:
                  summary: Notify block without channel
                  value:
                    error: canvas_validation
                    message: Notify block requires channel (telegram or email)
                    details:
                      - field: canvas.nodes
                        message: notify_missing_channel
                notifyInvalidEmail:
                  summary: Notify email channel without valid address
                  value:
                    error: canvas_validation
                    message: Notify block with email channel requires a valid emailAddress
                    details:
                      - field: canvas.nodes
                        message: notify_invalid_email
                orphanNodes:
                  summary: Disconnected nodes
                  value:
                    error: canvas_validation
                    message: Rule canvas contains nodes not reachable from the stream trigger
                    details:
                      - field: canvas.nodes
                        message: orphan_nodes

  /api/v1/rules/{id}:
    get:
      tags: [rules]
      summary: Get rule with canvas definition and versions
      operationId: getRule
      x-mvp: true
      parameters:
        - $ref: '#/components/parameters/ruleId'
      responses:
        '200':
          description: Rule detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingRuleDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [rules]
      summary: Update rule metadata or canvas
      description: |
        Same canvas validation as `POST /api/v1/rules` when `canvas` is included in the
        request body. Partial updates without `canvas` skip graph validation.
        When `enabled: true`, validates the stored (or patched) canvas if it has nodes;
        returns `400 canvas_validation` when the graph is invalid.
      operationId: patchRule
      x-mvp: true
      parameters:
        - $ref: '#/components/parameters/ruleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessingRulePatch'
      responses:
        '200':
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingRuleDetail'
        '400':
          description: Invalid canvas structure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [rules]
      summary: Delete rule
      operationId: deleteRule
      x-mvp: true
      parameters:
        - $ref: '#/components/parameters/ruleId'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/rules/{id}/activate:
    post:
      tags: [rules]
      summary: Enable rule (Monq «Запустить БП»)
      operationId: activateRule
      x-mvp: true
      parameters:
        - $ref: '#/components/parameters/ruleId'
      responses:
        '200':
          description: Rule activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingRule'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Rule not approved or canvas fails validation (same rules as POST/PATCH)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/rules/{id}/deactivate:
    post:
      tags: [rules]
      summary: Disable rule
      operationId: deactivateRule
      x-mvp: true
      parameters:
        - $ref: '#/components/parameters/ruleId'
      responses:
        '200':
          description: Rule deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingRule'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/rules/{id}/approve:
    post:
      tags: [rules]
      summary: Approve rule (Согласующий role)
      operationId: approveRule
      x-mvp: true
      parameters:
        - $ref: '#/components/parameters/ruleId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      responses:
        '200':
          description: Rule approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingRule'
        '403':
          description: Insufficient permissions
          content:
