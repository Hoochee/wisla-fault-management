  /api/v1/admin/products:
    get:
      tags: [admin]
      summary: List products (admin)
      description: Admin read of product records with linked CI ids. Does not include health aggregates (`maxSeverity`, `activeEventCount`); use `GET /api/v1/health/products` for heatmap data.
      operationId: listProducts
      x-mvp: true
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductAdmin'
        '403':
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [admin]
      summary: Create product
      description: |
        Creates a product. When `ciIds` is provided, links each CI via `product_ci`
        and binds new CIs to the product `COMMON` component (`weight=100`, `influenceType=weighted`),
        creating `COMMON` if it does not exist.
        Requires administrator role.
      operationId: createProduct
      x-mvp: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Product code already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/products/{id}:
    get:
      tags: [admin]
      summary: Get product by ID
      operationId: getProduct
      x-mvp: true
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAdmin'
        '403':
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [admin]
      summary: Update product
      description: |
        Partial update of product attributes. When `ciIds` is **present**, all existing
        `product_ci` rows for this product are deleted and replaced with the provided list
        (empty array clears all links). Newly added CIs that are not already slotted are bound
        to `COMMON`. When `ciIds` is **omitted**, CI membership is unchanged.
        Optional `components` replaces health slots (`code`, `name`, `weight`, `influenceType`,
        `criticalThreshold`, `ciIds`). Omit `components` to leave slots unchanged.
        At least one component `weight` must be > 0; a CI may belong to at most one slot
        of the same product (otherwise **400**).
        Requires administrator role.
      operationId: patchProduct
      x-mvp: true
      parameters:
        - $ref: '#/components/parameters/productId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPatch'
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Product code already exists on another product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [admin]
      summary: Delete product
      description: |
        Deletes a product with no linked CIs. When one or more CIs are still linked via
        `product_ci`, returns **409** — clear membership first (PATCH with `"ciIds": []`).
        Requires administrator role.
      operationId: deleteProduct
      x-mvp: true
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '204':
          description: Deleted
        '403':
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Product has linked configuration items; unlink CIs before delete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

