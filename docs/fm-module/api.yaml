components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User session JWT from `/api/v1/auth/login`
    sourceApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Per-source API key for ingest
    serviceApiKey:
      type: apiKey
      in: header
      name: X-Service-Key
      description: Adapter service account key for internal endpoints

  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    sourceKey:
      name: sourceKey
      in: query
      required: true
      schema:
        type: string
      description: Source API key identifier
    eventId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    sourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ruleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    mapId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    userId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    roleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ciId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    productId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
  # --- Primitives & enums ---
    Severity:
      type: string
      enum: [fatal, critical, major, minor, warning, normal]

    EventStatus:
      type: string
      enum: [new, in_progress, closed, archived, maintenance, deferred]

    SourceType:
      type: string
      enum: [push_rest, push_snmp_trap, pull_etl]

    SourceStatus:
      type: string
      enum: [active, inactive, blocked]

    RuleType:
      type: string
      enum: [dedup, problem_resolution, correlation, threshold]

    ApprovalStatus:
      type: string
      enum: [approved, pending, draft]

    HealthLevel:
      type: string
      enum: [fatal, critical, major, warning, ok, unknown]

    InfluenceType:
      type: string
      enum: [combo, weighted, critical]

    EventActionType:
      type: string
      enum: [take, close, comment, defer, maintenance]

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        version:
          type: string
        database:
          type: string
          enum: [up, down]

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    PageMeta:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

  # --- Auth ---
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Seconds until expiry
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, login, fullName, email, roleIds, team, active]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        fullName:
          type: string
        email:
          type: string
          format: email
        roleIds:
          type: array
          items:
            type: string
            format: uuid
        team:
          type: string
        active:
          type: boolean

    UserCreate:
      type: object
      required: [login, fullName, email, password, roleIds]
      properties:
        login:
          type: string
        fullName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        roleIds:
          type: array
          items:
            type: string
            format: uuid
        team:
          type: string
        active:
          type: boolean
          default: true

    UserPatch:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        roleIds:
          type: array
          items:
            type: string
            format: uuid
        team:
          type: string
        active:
          type: boolean
        password:
          type: string
          format: password

    UserPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/PageMeta'

    Role:
      type: object
      required: [id, name, description, permissions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
          description: |
            Permission codes, e.g. `console`, `events`, `sources`, `sources:read`,
            `rules`, `rules:approve`, `admin`, `settings`, `settings:profile`, `api:ingest`

    RoleCreate:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string

    RolePatch:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string

  # --- Ingest ---
    IngestRequest:
      type: object
      properties:
        heartbeat:
          type: boolean
          default: false
          description: Adapter heartbeat (no event payload)
        events:
          type: array
          items:
            $ref: '#/components/schemas/IngestEventPayload'
        adapterVersion:
          type: string
        receivedAt:
          type: string
          format: date-time

    IngestEventPayload:
      type: object
      required: [externalId, title, severity, occurredAt]
      properties:
        externalId:
          type: string
          description: Idempotency key from source
        title:
          type: string
        description:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        status:
          $ref: '#/components/schemas/EventStatus'
        occurredAt:
          type: string
          format: date-time
        nodeFqdn:
          type: string
        attributes:
          type: object
          additionalProperties: true
        rawPayload:
          type: object
          additionalProperties: true

    IngestResponse:
      type: object
      properties:
        accepted:
          type: integer
        rejected:
          type: integer
        rawEventIds:
          type: array
          items:
            type: string
            format: uuid
        heartbeatAck:
          type: boolean

  # --- Events ---
    Event:
      type: object
      required:
        - id
        - status
        - severity
        - title
        - description
        - repeatCount
        - ciId
        - nodeFqdn
        - systemName
        - sourceId
        - createdAt
        - sourceAt
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/EventStatus'
        severity:
          $ref: '#/components/schemas/Severity'
        title:
          type: string
        description:
          type: string
        assignedUserId:
          type: string
          format: uuid
        assignedUserName:
          type: string
          description: Denormalized display name (API only)
        repeatCount:
          type: integer
          minimum: 1
        ciId:
          type: string
          format: uuid
        nodeFqdn:
          type: string
        systemName:
          type: string
        subsystemName:
          type: string
        sourceId:
          type: string
          format: uuid
        sourceName:
          type: string
          description: Denormalized (API only)
        rootEventId:
          type: string
          format: uuid
          description: |
            Parent event ID when this event is a **child** in a correlation group.
            Set by the correlation canvas block when N matching events occur within the
            configured window; the earliest event in the window becomes the root.
            Omitted on root events and uncorrelated events.
        childEventIds:
          type: array
          items:
            type: string
            format: uuid
          description: |
            IDs of **child** events linked to this event as correlation root.
            Populated on `GET /api/v1/events/{id}` (EventDetail) when this event is the
            root of a correlation group. Empty or omitted when there are no children.
        itsmIncidentNumber:
          type: string
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        sourceAt:
          type: string
          format: date-time
        lastRepeatAt:
          type: string
          format: date-time
        takenAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EventDetail:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          description: |
            Event card view. Correlation links (`rootEventId`, `childEventIds`) reflect
            runtime output of enabled rules with a `correlation` canvas block.
          properties:
            attributes:
              type: array
              items:
                $ref: '#/components/schemas/EventAttribute'
            actionLogs:
              type: array
              items:
                $ref: '#/components/schemas/EventActionLog'
            rawEventId:
              type: string
              format: uuid

    EventAttribute:
      type: object
      properties:
        key:
          type: string
        type:
          type: string
          enum: [string, number, boolean, date, uuid]
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean

    EventCreate:
      type: object
      required: [title, severity, ciId, sourceId]
      properties:
        title:
          type: string
        description:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        status:
          $ref: '#/components/schemas/EventStatus'
        ciId:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid

    EventPatch:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/EventStatus'
        severity:
          $ref: '#/components/schemas/Severity'
        assignedUserId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        itsmIncidentNumber:
          type: string

    EventActionRequest:
      type: object
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/EventActionType'
        comment:
          type: string
          description: Required for `comment`; optional for other actions
        assignedUserId:
          type: string
          format: uuid
          description: Override assignee for `take`

    EventActionResult:
      type: object
      properties:
        event:
          $ref: '#/components/schemas/Event'
        logEntry:
          $ref: '#/components/schemas/EventActionLog'

    EventActionLog:
      type: object
      required: [id, eventId, action, userName, timestamp, details]
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        action:
          type: string
        userName:
          type: string
        userId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        details:
          type: string

    EventHistoryEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        field:
          type: string
        oldValue:
          type: string
        newValue:
          type: string
        userName:
          type: string

    EventPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        page:
          $ref: '#/components/schemas/PageMeta'

    RawEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            isRaw:
              type: boolean
              default: true
            processed:
              type: boolean
            processedEventId:
              type: string
              format: uuid
            ingestBatchId:
              type: string
              format: uuid

    RawEventPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RawEvent'
        page:
          $ref: '#/components/schemas/PageMeta'

  # --- Adapters runtime ---
    AdapterRuntimeResponse:
      type: object
      required: [service, sources]
      properties:
        service:
          $ref: '#/components/schemas/AdapterServiceRuntime'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceAdapterRuntime'

    AdapterServiceRuntime:
      type: object
      required: [status, baseUrl]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
          description: Adapter process health (`down` when health endpoint unreachable)
        version:
          type: string
          description: Deployed adapter version
        database:
          type: string
          enum: [up, down]
        fmModule:
          type: string
          enum: [reachable, unreachable, unknown]
        bufferedMessages:
          type: integer
          minimum: 0
        baseUrl:
          type: string
          format: uri
          description: Configured adapter base URL used for this aggregation

    SourceAdapterRuntime:
      type: object
      required:
        - sourceId
        - name
        - type
        - configStatus
        - adapterRuntimeStatus
      properties:
        sourceId:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/SourceType'
        configStatus:
          $ref: '#/components/schemas/SourceStatus'
        adapterRuntimeStatus:
          type: string
          enum: [running, idle, stopped, degraded, unreachable]
        adapterVersion:
          type: string
        lastSuccessAt:
          type: string
          format: date-time

  # --- Sources ---
    EventSource:
      type: object
      required:
        - id
        - name
        - type
        - protocol
        - endpoint
        - apiKey
        - adapterVersion
        - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/SourceType'
        protocol:
          type: string
        endpoint:
          type: string
        apiKey:
          type: string
          description: Masked in responses (e.g. `zk-****-mos-7f3a`)
        adapterVersion:
          type: string
        lastSuccessAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SourceStatus'
        schedule:
          type: string
          description: CRON for pull_etl sources

    EventSourceDetail:
      allOf:
        - $ref: '#/components/schemas/EventSource'
        - type: object
          properties:
            filterRules:
              type: object
              additionalProperties: true
            parserConfig:
              type: object
              additionalProperties: true
            webhookUrl:
              type: string
              description: Public adapter webhook URL

    EventSourceCreate:
      type: object
      required: [name, type, protocol, endpoint]
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/SourceType'
        protocol:
          type: string
        endpoint:
          type: string
        schedule:
          type: string
        filterRules:
          type: object
          additionalProperties: true
        parserConfig:
          type: object
          additionalProperties: true
        status:
          $ref: '#/components/schemas/SourceStatus'
          default: inactive

    EventSourcePatch:
      type: object
      properties:
        name:
          type: string
        protocol:
          type: string
        endpoint:
          type: string
        schedule:
          type: string
        status:
          $ref: '#/components/schemas/SourceStatus'
        filterRules:
          type: object
          additionalProperties: true
        parserConfig:
          type: object
          additionalProperties: true
        regenerateApiKey:
          type: boolean

    SourceTestRequest:
      type: object
      properties:
        ingestApiKey:
          type: string
          description: |
            Plain-text source API key from create/regenerate (held in UI sessionStorage).
            Required for a real probe when the key is not persisted in fm-module.

    SourceTestResult:
      type: object
      required: [success, testedAt]
      properties:
        success:
          type: boolean
        message:
          type: string
        testedAt:
          type: string
          format: date-time
        probeEventId:
          type: string
          format: uuid
        delivery:
          type: string
          enum: [forwarded, buffered, failed]
          description: Adapter probe delivery mode (mirrors adapter `ProbeResponse.delivery`)
        latencyMs:
          type: integer
          minimum: 0
          description: Round-trip latency reported by adapter probe

    BindSimulatorRequest:
      type: object
      required: [ingestApiKey]
      properties:
        ingestApiKey:
          type: string
          description: Plain-text source API key (`X-Source-Key`) passed to zabbix-simulator `/config`

    BindSimulatorResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        sourceWebhookKey:
          type: string
          description: Public webhook path key for this source
        adapterWebhookUrl:
          type: string
          format: uri
          description: Resolved adapter webhook URL configured on simulator
        simulatorEnabled:
          type: boolean
          description: Whether auto-tick is enabled on simulator after bind

    SourceSimulatorStatus:
      type: object
      required: [reachable, bound, enabled]
      properties:
        reachable:
          type: boolean
          description: zabbix-simulator health endpoint responded
        bound:
          type: boolean
          description: Simulator runtime config targets this source's webhook key
        enabled:
          type: boolean
          description: Auto-tick enabled (`SIMULATOR_ENABLED` / `POST /control`)
        sourceWebhookKey:
          type: string
        adapterWebhookUrl:
          type: string
          format: uri
        simulatorBaseUrl:
          type: string
          format: uri
        activeProblems:
          type: integer
          minimum: 0
          description: Active problem scenarios awaiting recovery on simulator
        message:
          type: string
          description: Human-readable status or error hint

    SourceSimulatorTickResult:
      type: object
      required: [kind, delivered]
      properties:
        kind:
          type: string
          enum: [problem, recovery, skip, error]
          description: |
            `problem` / `recovery` — webhook sent;
            `skip` — simulator disabled;
            `error` — delivery or configuration failure
        scenarioId:
          type: string
          nullable: true
        delivered:
          type: boolean
          description: Adapter accepted webhook (HTTP 2xx)
        httpStatus:
          type: integer
          nullable: true
          description: HTTP status from adapter webhook
        error:
          type: string
          nullable: true
        note:
          type: string
          nullable: true

    SourceSimulatorControlRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Whether zabbix-simulator should run periodic auto-tick

    SourceSimulatorControlResult:
      type: object
      required: [success, enabled]
      properties:
        success:
          type: boolean
        enabled:
          type: boolean
          description: Auto-tick state after `POST /control` on simulator
        message:
          type: string
          description: Human-readable status from simulator

    SourceRunLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [success, failed, running]
        recordsFetched:
          type: integer
        errorMessage:
          type: string

    InternalSourceConfig:
      type: object
      required: [sourceId, apiKeyHash, status, filterRules]
      properties:
        sourceId:
          type: string
          format: uuid
        apiKeyHash:
          type: string
        status:
          $ref: '#/components/schemas/SourceStatus'
        filterRules:
          type: object
          additionalProperties: true
        endpoint:
          type: string
        type:
          $ref: '#/components/schemas/SourceType'
        schedule:
          type: string
          description: Pull interval (`30s`) or CRON; used when `type=pull_etl`
          nullable: true
        parserConfig:
          type: object
          additionalProperties: true
          description: Prometheus scrape targets and threshold rules (`{}` for `push_rest`)
        updatedAt:
          type: string
          format: date-time

    InternalSourceIndex:
      type: object
      required: [sourceId, sourceKey, apiKeyHash, status, filterRules, type]
      properties:
        sourceId:
          type: string
          format: uuid
        sourceKey:
          type: string
          description: Public webhook key segment
        apiKeyHash:
          type: string
        status:
          $ref: '#/components/schemas/SourceStatus'
        filterRules:
          type: object
          additionalProperties: true
        type:
          $ref: '#/components/schemas/SourceType'
        schedule:
          type: string
          description: Pull interval (`30s`) or CRON; null/omitted for `push_rest`
          nullable: true
        parserConfig:
          type: object
          additionalProperties: true
          description: Prometheus scrape targets and threshold rules; empty object for `push_rest`

  # --- Rules ---
    ProcessingRule:
      type: object
      required:
        - id
        - name
        - ruleType
        - enabled
        - triggerType
        - approvalStatus
        - description
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ruleType:
          $ref: '#/components/schemas/RuleType'
        enabled:
          type: boolean
        triggerType:
          type: string
          example: Событие потока
        lastRunAt:
          type: string
          format: date-time
        approvalStatus:
          $ref: '#/components/schemas/ApprovalStatus'
        description:
          type: string

    ProcessingRuleDetail:
      allOf:
        - $ref: '#/components/schemas/ProcessingRule'
        - type: object
          properties:
            canvas:
              $ref: '#/components/schemas/RuleCanvas'
            versions:
              type: array
              items:
                $ref: '#/components/schemas/RuleVersion'

    ProcessingRuleCreate:
      type: object
      required: [name, ruleType, triggerType]
      properties:
        name:
          type: string
        ruleType:
          $ref: '#/components/schemas/RuleType'
        triggerType:
          type: string
        description:
          type: string
        canvas:
          $ref: '#/components/schemas/RuleCanvas'

    ProcessingRulePatch:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        triggerType:
          type: string
        enabled:
          type: boolean
          description: Enable or disable rule. When set to true, canvas validation runs if the rule has nodes.
        canvas:
          $ref: '#/components/schemas/RuleCanvas'

    RuleBlockType:
      type: string
      enum: [trigger, condition, switch, dedup, threshold, correlation, notify, push, status]
      description: |
        Canvas node type. **Runtime-supported:** `trigger`, `condition`, `switch`, `dedup`,
        `threshold`, `correlation`, `notify`, `push`. `notify` records outbound intent only
        (stub — no real SMTP/Telegram in MVP+). `push` persists in-app notifications for UI polling.
        `status` is stored but not executed (post-MVP).

    RuleTriggerType:
      type: string
      enum: [stream, fm]
      description: |
        Trigger subtype in `data.triggerType`. Only `stream` is required for a valid canvas
        and executed at runtime. `fm` is reserved (post-MVP).

    RuleConditionField:
      type: string
      enum: [severity, title, status, nodeFqdn]

    RuleConditionOperator:
      type: string
      enum: [eq, ne, contains]

    RuleCorrelationMatchField:
      type: string
      enum: [title, severity, source]
      description: Optional field used to group events in the correlation window

    NotifyChannel:
      type: string
      enum: [telegram, email]
      description: Outbound channel for the notify canvas block

    RuleCanvasNode:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/RuleBlockType'
        position:
          type: object
          properties:
            x:
              type: number
            y:
              type: number
        data:
          type: object
          description: |
            Block label and type-specific config (mirrors frontend `RuleBlock.config`).

            | `type` | `data` keys | Notes |
            |--------|-------------|-------|
            | `trigger` | `triggerType` (`stream` \| `fm`), `label` | `stream` required for valid canvas |
            | `condition` | `field`, `operator`, `value`, `label` | `field` ∈ severity, title, status, nodeFqdn; `operator` ∈ eq, ne, contains |
            | `switch` | `label` | First matching outgoing branch continues traversal |
            | `dedup` | `key`, `label` | Optional merge key; default source+title+CI |
            | `threshold` | `count`, `windowMin`, `label` | Sliding window per source+CI |
            | `correlation` | `count`, `windowMin`, `matchField`, `label` | Links events as root/child when count reached in window |
            | `notify` | `channel` (`telegram` \| `email`), `emailAddress`, `label` | `emailAddress` required when `channel=email`; runtime stub (no real send in MVP+) |
            | `push` | `message`, `label` | In-app toast; `message` supports `{title}`, `{severity}` placeholders |
            | `status` | `status`, `label` | Post-MVP; not executed at runtime |
          additionalProperties: true

    RuleCanvasEdge:
      type: object
      required: [id, source, target]
      properties:
        id:
          type: string
        source:
          type: string
          description: Source node id
        target:
          type: string
          description: Target node id
        label:
          type: string
          description: Optional branch label for switch outgoing edges (default branch when omitted)

    RuleCanvas:
      type: object
      description: |
        Visual rule builder graph (Monq BP-style). Persisted on create/update; interpreted
        at runtime for enabled rules. Empty `nodes` falls back to legacy `ruleType` behavior.
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/RuleCanvasNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/RuleCanvasEdge'

    RuleVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        versionNumber:
          type: integer
        createdAt:
          type: string
          format: date-time
        createdByUserName:
          type: string
        comment:
          type: string
        canvas:
          $ref: '#/components/schemas/RuleCanvas'

    PushNotification:
      type: object
      required: [id, ruleId, eventId, title, message, createdAt]
      properties:
        id:
          type: string
          format: uuid
        ruleId:
          type: string
          format: uuid
          description: Processing rule whose push block created this notification
        eventId:
          type: string
          format: uuid
          description: Console event that triggered the push block
        title:
          type: string
          description: Event title shown in toast header
        message:
          type: string
          description: Rendered message from push block template
        createdAt:
          type: string
          format: date-time

    PushNotificationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PushNotification'

  # --- Health ---
    ProductHealth:
      type: object
      required: [id, name, tenant, site, maxSeverity, activeEventCount, ciIds, tags]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tenant:
          type: string
        site:
          type: string
        maxSeverity:
          $ref: '#/components/schemas/Severity'
        activeEventCount:
          type: integer
        ciIds:
          type: array
          items:
            type: string
            format: uuid
        tags:
          type: array
          items:
            type: string
        healthPercent:
          type: integer
          description: Server-computed product health 0–100 from `product_health_snapshot`
        damagePercent:
          type: integer
          description: Server-computed damage used for heatmap intensity and Sankey width
        components:
          type: array
          description: Component breakdown from the snapshot (code, percents)
          items:
            $ref: '#/components/schemas/ProductComponentHealth'

    ProductHealthDetail:
      allOf:
        - $ref: '#/components/schemas/ProductHealth'
        - type: object
          properties:
            configurationItems:
              type: array
              items:
                $ref: '#/components/schemas/ConfigurationItem'
            activeEvents:
              type: array
              items:
                $ref: '#/components/schemas/Event'
            severityBreakdown:
              type: object
              additionalProperties:
                type: integer
            sankey:
              $ref: '#/components/schemas/ProductHealthSankey'
            calculatedAt:
              type: string
              format: date-time
              description: Snapshot calculation time
            minHealthToday:
              type: integer
              description: Minimum `healthPercent` in today's history buckets
            maxHealthToday:
              type: integer
              description: Maximum `healthPercent` in today's history buckets

    ProductComponentHealth:
      type: object
      required: [code, name, healthPercent, damagePercent]
      properties:
        code:
          type: string
          description: Slot code (POWER, CPU, HDD, AVAILABILITY, COMMON, …)
        name:
          type: string
        healthPercent:
          type: integer
        damagePercent:
          type: integer
        weight:
          type: integer
        influenceType:
          $ref: '#/components/schemas/InfluenceType'
        ciIds:
          type: array
          items:
            type: string
            format: uuid

    ProductHealthSankey:
      type: object
      required: [nodes, links]
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ProductHealthSankeyNode'
        links:
          type: array
          items:
            $ref: '#/components/schemas/ProductHealthSankeyLink'

    ProductHealthSankeyNode:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
        kind:
          type: string
          description: Node kind (product, component, ci, signal)

    ProductHealthSankeyLink:
      type: object
      required: [from, to, damage]
      properties:
        from:
          type: string
        to:
          type: string
        damage:
          type: integer
          description: Link width from server-computed damage

    ProductHealthHistoryBucket:
      type: object
      required: [bucketStart, bucketMinutes, minHealth, maxHealth, worstSeverity]
      properties:
        bucketStart:
          type: string
          format: date-time
        bucketMinutes:
          type: integer
        minHealth:
          type: integer
        maxHealth:
          type: integer
        worstSeverity:
          $ref: '#/components/schemas/Severity'

    CiHealthProfile:
      type: object
      required:
        - ciId
        - currentHealth
        - healthPercent
        - minToday
        - minTodayPercent
        - maxToday
        - maxTodayPercent
        - components
        - dependents
        - signalsBySeverity
        - timeline
      properties:
        ciId:
          type: string
          format: uuid
        currentHealth:
          $ref: '#/components/schemas/HealthLevel'
        healthPercent:
          type: number
        minToday:
          $ref: '#/components/schemas/HealthLevel'
        minTodayPercent:
          type: number
        maxToday:
          $ref: '#/components/schemas/HealthLevel'
        maxTodayPercent:
          type: number
        components:
          type: array
          items:
            $ref: '#/components/schemas/CiComponentHealth'
        dependents:
          type: array
          items:
            $ref: '#/components/schemas/DependentCi'
        signalsBySeverity:
          type: object
          properties:
            fatal:
              type: integer
            critical:
              type: integer
            major:
              type: integer
            minor:
              type: integer
            warning:
              type: integer
            normal:
              type: integer
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/HealthTimelinePoint'

    CiComponentHealth:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        health:
          $ref: '#/components/schemas/HealthLevel'
        healthPercent:
          type: number
        damageFromComponents:
          type: number
        damageFromInfluence:
          type: number

    DependentCi:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fqdn:
          type: string
        componentName:
          type: string
        health:
          $ref: '#/components/schemas/HealthLevel'
        healthPercent:
          type: number
        influenceType:
          $ref: '#/components/schemas/InfluenceType'

    HealthTimelinePoint:
      type: object
      properties:
        time:
          type: string
        percent:
          type: number
        level:
          $ref: '#/components/schemas/HealthLevel'

  # --- Console maps ---
    EventMap:
      type: object
      required: [id, name, query, isSystem, isPersonal, columns]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        query:
          type: string
        isSystem:
          type: boolean
        isPersonal:
          type: boolean
        columns:
          type: array
          items:
            type: string
        unsaved:
          type: boolean
          description: Client-side draft flag (not persisted)

    EventMapCreate:
      type: object
      required: [name, query, columns]
      properties:
        name:
          type: string
        query:
          type: string
        columns:
          type: array
          items:
            type: string
        isPersonal:
          type: boolean
          default: true

    EventMapPatch:
      type: object
      properties:
        name:
          type: string
        query:
          type: string
        columns:
          type: array
          items:
            type: string

  # --- CMDB ---
    ConfigurationItem:
      type: object
      required: [id, fqdn, ciType, system, subsystem, software, products, tags]
      properties:
        id:
          type: string
          format: uuid
        fqdn:
          type: string
        ciType:
          type: string
        system:
          type: string
        subsystem:
          type: string
        software:
          type: string
        products:
          type: array
          items:
            type: string
            format: uuid
        tags:
          type: array
          items:
            type: string
        externalIds:
          type: object
          additionalProperties:
            type: string

    ConfigurationItemCreate:
      type: object
      required: [fqdn, ciType, system]
      properties:
        fqdn:
          type: string
        ciType:
          type: string
        system:
          type: string
        subsystem:
          type: string
        software:
          type: string
        productIds:
          type: array
          items:
            type: string
            format: uuid
        tags:
          type: array
          items:
            type: string
        externalIds:
          type: object
          additionalProperties:
            type: string

    ConfigurationItemPatch:
      type: object
      properties:
        fqdn:
          type: string
        ciType:
          type: string
        system:
          type: string
        subsystem:
          type: string
        software:
          type: string
        productIds:
          type: array
          items:
            type: string
            format: uuid
        tags:
          type: array
          items:
            type: string
        externalIds:
          type: object
          additionalProperties:
            type: string

    ConfigurationItemPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConfigurationItem'
        page:
          $ref: '#/components/schemas/PageMeta'

    ProductAdmin:
      type: object
      required: [id, name, code, tenant, site, tags, ciIds]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
          description: Unique product code (max 64 chars)
        tenant:
          type: string
        site:
          type: string
        tags:
          type: array
          items:
            type: string
        ciIds:
          type: array
          description: IDs of configuration items linked via `product_ci`
          items:
            type: string
            format: uuid
        components:
          type: array
          description: Health slots (`product_component`) with CI assignments
          items:
            $ref: '#/components/schemas/ProductComponentAdmin'

    ProductCreate:
      type: object
      required: [name, code, tenant, site]
      properties:
        name:
          type: string
        code:
          type: string
          description: Unique product code (max 64 chars)
        tenant:
          type: string
        site:
          type: string
        tags:
          type: array
          items:
            type: string
        ciIds:
          type: array
          description: |
            Optional CI ids to link on create; each id must exist.
            New CIs are also bound to `COMMON` (created if missing).
          items:
            type: string
            format: uuid

    ProductPatch:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
          description: Unique product code (max 64 chars); must not duplicate another product
        tenant:
          type: string
        site:
          type: string
        tags:
          type: array
          items:
            type: string
        ciIds:
          type: array
          description: |
            When present, replaces all `product_ci` links for this product (empty array clears all).
            When omitted, CI membership is unchanged. Each id must exist.
            Newly added CIs without a slot are bound to `COMMON`.
          items:
            type: string
            format: uuid
        components:
          type: array
          description: |
            When present, replaces all health component slots for this product.
            When omitted, slots are unchanged. At least one `weight` must be > 0.
            A CI may appear in at most one slot of the same product.
          items:
            $ref: '#/components/schemas/ProductComponentPatch'

    ProductComponentAdmin:
      type: object
      required: [id, code, name, weight, influenceType, ciIds]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        weight:
          type: integer
          minimum: 0
          maximum: 100
        influenceType:
          $ref: '#/components/schemas/InfluenceType'
        criticalThreshold:
          type: integer
          description: Threshold for `critical` influence (default 100)
        ciIds:
          type: array
          items:
            type: string
            format: uuid

    ProductComponentPatch:
      type: object
      required: [code, name, weight, influenceType]
      properties:
        code:
          type: string
        name:
          type: string
        weight:
          type: integer
          minimum: 0
          maximum: 100
        influenceType:
          $ref: '#/components/schemas/InfluenceType'
          description: Product health uses `weighted` or `critical` (`combo` is not applied)
        criticalThreshold:
          type: integer
          description: Threshold for `critical` influence (default 100)
        ciIds:
          type: array
          items:
            type: string
            format: uuid

  # --- Settings ---
    Settings:
      type: object
      required: [timezone, pollingIntervalSec, autoArchiveDays, repeatIntervalMin, wislaIntegration, itsmIntegration]
      properties:
        timezone:
          type: string
          example: Europe/Moscow
        pollingIntervalSec:
          type: integer
          minimum: 5
          maximum: 300
        autoArchiveDays:
          type: integer
        repeatIntervalMin:
          type: integer
        wislaIntegration:
          type: boolean
        itsmIntegration:
          type: boolean

    UserPreferences:
      type: object
      properties:
        sidebarCollapsed:
          type: boolean
        defaultMapId:
          type: string
          format: uuid
        columnLayouts:
          type: object
          additionalProperties: true

    SettingsBundle:
      type: object
      properties:
        module:
          $ref: '#/components/schemas/Settings'
        profile:
          $ref: '#/components/schemas/UserPreferences'

    SettingsPatch:
      type: object
      properties:
        module:
          $ref: '#/components/schemas/Settings'
        profile:
          $ref: '#/components/schemas/UserPreferences'

    NotificationSettings:
      type: object
      properties:
        emailEnabled:
          type: boolean
        telegramEnabled:
          type: boolean
        rules:
          type: array
          items:
            type: object
            additionalProperties: true

    IntegrationSettings:
      type: object
      properties:
        wisla:
          type: object
          properties:
            enabled:
              type: boolean
            baseUrl:
              type: string
            apiToken:
              type: string
        itsm:
          type: object
          properties:
            enabled:
              type: boolean
            endpoint:
              type: string
            mapping:
              type: object
              additionalProperties: true

    ConsoleScope:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tenant:
          type: string
        roleIds:
          type: array
          items:
            type: string
            format: uuid

    ConsoleScopeCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        tenant:
          type: string
        roleIds:
          type: array
          items:
            type: string
            format: uuid

  # --- Dashboard ---
    DashboardSummary:
      type: object
      properties:
        severityCounts:
          type: object
          description: Active events (non-closed/archived) per severity
          properties:
            fatal:
              type: integer
            critical:
              type: integer
            major:
              type: integer
            minor:
              type: integer
            warning:
              type: integer
            normal:
              type: integer
        totalActive:
          type: integer
        productPreview:
          type: array
          items:
            $ref: '#/components/schemas/ProductHealth'
        systemMaps:
          type: array
          items:
            $ref: '#/components/schemas/EventMap'

  # --- Downtime (post-MVP) ---
    Downtime:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopeType:
          type: string
          enum: [ci, product, source]
        scopeId:
          type: string
          format: uuid
        scheduleType:
          type: string
          enum: [permanent, temporary]
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [scheduled, active, completed, cancelled]
        suppressedActions:
          type: array
          items:
            type: string

    DowntimeCreate:
      type: object
      required: [name, scopeType, scopeId, scheduleType]
      properties:
        name:
          type: string
        scopeType:
          type: string
          enum: [ci, product, source]
        scopeId:
          type: string
          format: uuid
        scheduleType:
          type: string
          enum: [permanent, temporary]
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        suppressedActions:
          type: array
          items:
            type: string

    DowntimePatch:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [scheduled, active, completed, cancelled]
        endsAt:
          type: string
          format: date-time

security:
  - bearerAuth: []
