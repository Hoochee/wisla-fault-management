spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:wisla_fm_adapter;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  liquibase:
    enabled: false

wisla:
  adapter:
    fm-module-health-check-enabled: false
    internal-service-token: test-internal-token
    max-payload-bytes: 1024
