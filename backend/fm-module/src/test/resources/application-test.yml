spring:
  datasource:
    url: jdbc:h2:mem:wisla_fm;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    consumer:
      group-id: fm-module-ingestion
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      auto-startup: false
      ack-mode: record

adapter:
  base-url: http://localhost:18081
  public-url: http://localhost:18081
  internal-token: test-internal-token

zabbix-simulator:
  base-url: http://localhost:18082

wisla:
  jwt:
    secret: test-jwt-secret-at-least-32-characters-long
    expiration-seconds: 3600
  service:
    api-key: test-service-key
  kafka:
    raw-events-topic: fm.raw-events
